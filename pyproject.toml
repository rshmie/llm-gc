[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gc"
version = "0.1.0"
description = "Context-aware garbage collection for LLMs with built-in epistemic transparency — see what your model remembers, what it's forgotten, and when to worry."
requires-python = ">=3.13"
dependencies = ["pydantic", "tiktoken", "numpy", "sentence-transformers", "fastapi", "uvicorn", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.mypy]
python_version = "3.13"
files = ["src/llm_gc"]

[[tool.mypy.overrides]]
module = ["llm_gc.llm.*", "llm_gc.exceptions"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

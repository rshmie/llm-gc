# llm-gc.toml: LLM-GC's settings, written by `llm-gc config init`.
#
# Every setting is listed at its default and commented out, so this file changes nothing
# until you edit it. A commented setting is not switched off: its default applies. To
# change one, remove the `#` in front of its line and set the value. Settings left
# commented follow LLM-GC's defaults, including improved ones in later versions.
#
# LLM-GC's own key never goes here: it belongs in .env (see .env.example).
# `llm-gc config show` prints the settings in effect and where each value came from.


# ── Proxy ──────────────────────────────────────────────────────────────────────────────

# Where the proxy listens, on localhost only. Claude Code's ANTHROPIC_BASE_URL points here.
# port = 9900

# The live dashboard. Off unless asked for, because it shows your conversations.
# dashboard = false
# dashboard_port = 9901

# Where requests go on to: Anthropic, or your company's gateway. Behind a gateway, set it
# to the ANTHROPIC_BASE_URL in ~/.claude/settings.json.
# upstream = "https://api.anthropic.com"

# How much LLM-GC logs: DEBUG, INFO, WARNING, ERROR or CRITICAL. INFO prints a line per
# request.
# log_level = "INFO"


# ── Summaries ──────────────────────────────────────────────────────────────────────────

# "llm" condenses old exchanges with a model, paid for by LLM-GC's own key. "noop" makes
# no model calls: old exchanges are kept or archived, never summarised.
# compactor = "llm"

[summary]

# The vendor LLM-GC summarises with: "anthropic" or "openai".
# provider = "anthropic"

# The model LLM-GC calls for its own summaries and facts, not the model you talk to.
# Behind a gateway, use a name the gateway offers, such as the value of
# ANTHROPIC_DEFAULT_SONNET_MODEL in ~/.claude/settings.json.
# model = "claude-sonnet-5"

# Where summary calls go. Unset by default: with "anthropic" they follow `upstream`
# (Anthropic, or your gateway), and with "openai" they go to OpenAI's own address. Set it
# only to send summaries somewhere else; the address below is an example.
# base_url = "https://summaries.example.com"


# ── Garbage collection ─────────────────────────────────────────────────────────────────
# Starting points, meant to be tuned while watching the dashboard.

[engine]

# The proxied model's input window, in tokens. Raise it only if every model you proxy has
# a larger one: a window set too large lets the recap outgrow the model's.
# context_window = 200000

# The newest turns, always sent word for word.
# last_n_turns_to_keep = 5

# A collection runs once the turns it would condense add up to this many tokens.
# min_cut_tokens = 1000

# The recap's budget, as a share of the window.
# max_recap_ratio = 0.3

# Score lines between detail levels. At or above keep_threshold an exchange is quoted
# whole; below archive_threshold it is archived to its opening line and facts; between
# the two it is summarised.
# keep_threshold = 0.7
# archive_threshold = 0.3

# How far past a line a score must move before an exchange changes level, so one near a
# line does not flip back and forth between collections.
# level_margin = 0.05

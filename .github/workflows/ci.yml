# Lints, type-checks and tests every change. The README's "Developing LLM-GC" lists the same
# commands, so a red run reproduces locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repository, so its token gets no more than that.
permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Each commit on main has a group of
# its own, so none of those runs is cancelled or skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    # A hung test would otherwise hold the runner for the six-hour default.
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved after the fact.
      # Dependabot proposes the bumps (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later pushes, so the token need not stay in .git/config.
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv is pinned too: an unpinned tool is a moving part in a build meant to be repeatable.
          version: "0.11.28"
          python-version: "3.13"

      # --locked fails if uv.lock no longer matches pyproject.toml, so the two cannot drift.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type-check
        run: uv run --no-sync mypy

      - name: Test
        run: uv run --no-sync pytest

name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repository, so their token gets no more than that.
permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Each commit on main has a group of
# its own, so none of those runs is cancelled or skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One job per check, so each one is its own row on a pull request and a lint failure does not
# hide the test result. The jobs repeat the same setup; Dependabot bumps every copy of a pinned
# action in one pull request, so the copies cannot drift apart. A required status check refers
# to a job by its name, so renaming a job, or changing the Python versions in the test matrix,
# means updating that rule too. The names are: Lint, Type-check, Test (3.13), Test (3.14) and
# Library-only install.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    # A hung step would otherwise hold the runner for the six-hour default.
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved after the fact.
      # Dependabot proposes the bumps (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later pushes, so the token need not stay in .git/config.
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # uv is pinned too: an unpinned tool is a moving part in a build meant to be repeatable.
          version: "0.11.28"
          python-version: "3.13"

      # --locked fails if uv.lock no longer matches pyproject.toml, so the two cannot drift. It
      # also gives every job the ruff, mypy and pytest versions the lockfile names.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      # Only checks: it fails if `ruff format` would change a file, and never changes one itself.
      - name: Format check
        run: uv run --no-sync ruff format --check .

  types:
    name: Type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Type-check
        run: uv run --no-sync mypy

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # A failure on one Python version must not hide the result on the other.
      fail-fast: false
      matrix:
        # Every Python version that requires-python admits and the tests pass on. Lint and the
        # type check run on the oldest one only, which is what mypy is configured for.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run --no-sync pytest

  # What `pip install llm-gc` gives someone who does not ask for the `proxy` extra. The tests run
  # with every package installed, so they cannot see a library module that needs one it does not
  # declare; this job installs the library alone and checks it from there.
  library:
    name: Library-only install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
          python-version: "3.13"

      # --no-dev and no --extra: only the dependencies every user gets.
      - name: Install the library alone
        run: uv sync --locked --no-dev

      - name: Import the library
        run: uv run --no-sync python -c "import llm_gc; print(llm_gc.__version__)"

      # Without the web server the command cannot start. It must say so and name the fix, not
      # fail with a bare ImportError.
      - name: The command says what to install
        run: |
          status=0
          output=$(uv run --no-sync llm-gc --version 2>&1) || status=$?
          echo "$output"
          test "$status" -eq 1
          grep -qF 'llm-gc[proxy]' <<< "$output"
